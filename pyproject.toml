[project]
name = "student-placement-prediction"
version = "1.0.0"
description = "Machine learning system for student placement prediction"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (formatting handles line wrapping)
    "B008",  # do not perform function calls in argument defaults (FastAPI Query/Depends)
]

[tool.ruff.lint.per-file-ignores]
# These modules live outside the repo root package and must insert the repo
# root onto sys.path before they can import feature_engineering, so their
# imports legitimately cannot all sit at the top of the file.
"frontend/app.py" = ["E402"]
"frontend/batch_predictor.py" = ["E402"]
"part2/hp_sensitivity_analysis.py" = ["E402"]
"part2/logistic_regression_model.py" = ["E402"]
"part2/model_comparison.py" = ["E402"]
"part2/model_summary_report.py" = ["E402"]
"part2/random_forest_model.py" = ["E402"]
"part3/predict_sample.py" = ["E402"]
"part3/xgboost_model.py" = ["E402"]
"part4/explainability_fairness.py" = ["E402"]
"part8/evaluation_suite.py" = ["E402"]
"scripts/train_models_fast.py" = ["E402"]
"tests/test_custom_csv_simulation.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "feature_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
